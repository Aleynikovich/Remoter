<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remoter</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="connect-view">
  <h1>Remoter</h1>
  <p>Enter the password of the remote computer.</p>
  <form id="connect-form">
    <label>Password <input id="password" type="password" autocomplete="current-password" required autofocus></label>
    <label>Partner ID <span class="hint">only needed if several computers are shared</span>
      <input id="id" inputmode="numeric" autocomplete="off" placeholder="optional"></label>
    <button type="submit">Connect</button>
    <p id="status" role="status"></p>
  </form>
</main>
<div id="session-view" hidden>
  <header>
    <span id="session-label"></span>
    <span id="stats"></span>
    <span id="build" title="Remoter build running on the remote computer"></span>
    <span id="notice" role="status"></span>
    <select id="display" title="Display" hidden></select>
    <select id="keys" title="Send a key combination">
      <option value="">Send keys…</option>
      <option value="MetaLeft">Windows key</option>
      <option value="MetaLeft+KeyR">Win+R (Run)</option>
      <option value="MetaLeft+KeyD">Win+D (Desktop)</option>
      <option value="MetaLeft+KeyE">Win+E (Explorer)</option>
      <option value="AltLeft+Tab">Alt+Tab</option>
      <option value="AltLeft+F4">Alt+F4</option>
      <option value="ControlLeft+ShiftLeft+Escape">Ctrl+Shift+Esc (Task Manager)</option>
      <option value="ControlLeft+KeyW">Ctrl+W</option>
      <option value="ControlLeft+KeyT">Ctrl+T</option>
      <option value="ControlLeft+KeyN">Ctrl+N</option>
    </select>
    <button id="scale" class="secondary" title="Switch between fit to window and actual size">1:1</button>
    <button id="fullscreen" class="secondary">Full screen</button>
    <button id="diag" class="secondary" title="Collect logs and timings from both ends">Diagnostics</button>
    <button id="disconnect">Disconnect</button>
  </header>
  <dialog id="diag-dialog">
    <p>Diagnostics from this viewer and the remote computer. Copy them and paste them into the chat.</p>
    <textarea id="diag-text" readonly rows="20" cols="100"></textarea>
    <div class="diag-buttons">
      <button id="diag-copy">Copy</button>
      <button id="diag-close" class="secondary">Close</button>
    </div>
  </dialog>
  <div id="screen-wrap"><canvas id="screen" tabindex="0"></canvas></div>
</div>
<script src="viewer.js"></script>
</body>
</html>
