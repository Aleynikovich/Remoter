name: Release
# Version tags (v1.2.3) publish a release. Pushes to main and to work
# branches publish a numbered dev prerelease so builds can be tried before a
# version is cut. Every Remoter installs the newest one: it is one program
# that both shares a computer and views others. remoter-version.txt marks
# these builds; host-only builds from branches that predate the single app
# lack it, so an installed app never turns back into one of them.
on:
  push:
    tags: ["v*"]
    branches: [main, "claude/**", "!claude/project-thread-yv34xl", "!claude/project-thread-shn7nm", "!claude/project-thread-ve9ty9"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          # SDL and FFmpeg (for the viewer) are loaded at run time, so no
          # cgo is needed.
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
        run: |
          mkdir dist
          for target in windows/amd64 linux/amd64 linux/arm64; do
            os=${target%/*}; arch=${target#*/}
            ext=""; [ "$os" = windows ] && ext=".exe"
            # The version stamp is what lets the binary find newer releases
            # and update itself.
            GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/aleynikovich/remoter/internal/update.Version=$VERSION" \
              -o "dist/remoter-${os}-${arch}${ext}" ./cmd/remoter
          done
          echo "$VERSION" > dist/remoter-version.txt
          cp scripts/install-viewer.sh scripts/install-share.sh dist/
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('dev-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Dev build {0} ({1})', github.run_number, github.ref_name) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
          generate_release_notes: true
