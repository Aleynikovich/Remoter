name: Viewer
# The desktop viewer used to be its own program with its own viewer-dev-N
# releases. It is now part of remoter (release.yml), and this workflow
# only moves copies of the old viewer over: it publishes the single app
# under the old viewer's file names, so their updater installs it. The app
# then follows the dev-N releases like every other Remoter, and keeps
# opening as the viewer while its file is still named remoter-viewer.
on:
  push:
    tags: ["v*"]
    branches: [main, "claude/**", "!claude/project-thread-jb47gi"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || format('viewer-dev-{0}', github.run_number) }}
        run: |
          mkdir dist
          ldflags="-s -w -X github.com/aleynikovich/remoter/internal/update.Version=$VERSION"
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "$ldflags" \
              -o "dist/remoter-viewer-linux-$arch" ./cmd/remoter
          done
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$ldflags" \
            -o dist/remoter-viewer-windows-amd64.exe ./cmd/remoter
          cp scripts/install-viewer.sh dist/
          ls -l dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('viewer-dev-{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('Desktop viewer {0} ({1})', github.run_number, github.ref_name) }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.ref_type != 'tag' || contains(github.ref_name, '-') }}
